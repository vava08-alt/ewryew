  ghost:       {display: "<gradient:#b0bec5:#eceff1>Призрак</gradient>", case: true}
  reaper13:    {display: "<gradient:#ff6f00:#4a148c>☠ Король Хэллоуина</gradient>", case: true}

# ================= КВЕСТЫ =================
# Каждый день игрок получает 3 случайных квеста. Типы: KILL_PLAYER, KILL_MOB, MINE, PLACE, FISH, PLAYTIME, AIRDROP
quests:
  daily-count: 3
  all-done-bonus: 300
  all-done-ari: 1
  all-done-key: title        # +1 ключ кейса титулов за все квесты дня
  pool:
    kill_players: {name: "Убить 3 игроков",       type: KILL_PLAYER, amount: 3,   reward: 400}
    kill_mobs:    {name: "Убить 40 мобов",         type: KILL_MOB,    amount: 40,  reward: 150}
    mine_stone:   {name: "Добыть 256 камня",       type: MINE, materials: [STONE, COBBLESTONE, DEEPSLATE, COBBLED_DEEPSLATE, ANDESITE, DIORITE, GRANITE, TUFF], amount: 256, reward: 120}
    mine_diamond: {name: "Добыть 5 алмазной руды", type: MINE, materials: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE], amount: 5, reward: 350}
    mine_iron:    {name: "Добыть 24 железной руды", type: MINE, materials: [IRON_ORE, DEEPSLATE_IRON_ORE], amount: 24, reward: 200}
    mine_logs:    {name: "Срубить 64 бревна",      type: MINE, materials: ["*_LOG"], amount: 64, reward: 120}
    mine_debris:  {name: "Найти 2 древних обломка", type: MINE, materials: [ANCIENT_DEBRIS], amount: 2, reward: 600}
    place:        {name: "Поставить 300 блоков",    type: PLACE, amount: 300, reward: 120}
    fish:         {name: "Поймать 10 рыб",          type: FISH, amount: 10, reward: 180}
    play:         {name: "Отыграть 60 минут",       type: PLAYTIME, amount: 60, reward: 250}
    airdrop:      {name: "Открыть аирдроп",         type: AIRDROP, amount: 1, reward: 500}

# ================= ИВЕНТЫ =================
# Ивенты идут по кругу (rotation) каждые interval-minutes. Боссбар ивента виден только в bossbar-radius блоках.
# /event delay - что идёт сейчас, где, и когда следующий. Запуск вручную: /event start <тип>
events:
  interval-minutes: 15
  bossbar-radius: 20
  rotation: [airdrop, meteor, boss, zeus, airdrop, dungeon, meteor, tournament]
  # Редкости: common (обычный) / rare (редкий) / epic (эпический) / divine (божественный). Вес = шанс выпадения
  rarity-weights: {common: 50, rare: 30, epic: 15, divine: 5}
  # Пулы для строк "pool:<имя>:шанс%" - выдаётся один случайный предмет пула
  pools:
    # вес после * : чем больше, тем чаще (без * - равные шансы)
    talismans_low: ["custom:talisman_fish*55", "custom:talisman_jellyfish*30", "custom:talisman_turtle*15"]
    talismans_mid: ["custom:talisman_dolphin*65", "custom:talisman_shark*35"]
    talismans_top: ["custom:talisman_kraken*75", "custom:talisman_poseidon*25"]
    spheres_low: ["custom:sphere_fish*55", "custom:sphere_jellyfish*30", "custom:sphere_turtle*15"]
    spheres_mid: ["custom:sphere_dolphin"]                      # обычный/редкий лут: максимум Дельфин
    spheres_high: ["custom:sphere_shark*75", "custom:sphere_kraken*25"] # Акула и выше - только эпик/божественный
    legendary: ["custom:kratos_blade", "custom:leviathan_axe", "custom:artemis_bow", "custom:zeus_trident", "custom:hades_scythe", "custom:poseidon_mace", "custom:apollo_crossbow", "custom:ares_shield", "custom:hermes_boots"]
    tools: ["custom:titan_pickaxe", "custom:hephaestus_drill"]
    special: ["custom:golden_dome*20", "custom:truth_snow*25", "custom:aqua_charge*15", "custom:sea_aura*15", "custom:temple_wall*10", "custom:coral_net*15"]   # спец-предметы
    don_potions: ["custom:athena_kiss*25", "custom:reaper_blood*20", "custom:storm_potion*25", "custom:fugu_potion*30", "custom:rage_potion*20"]   # донатные зелья
    olympus: ["custom:olympus_helmet", "custom:olympus_chestplate", "custom:olympus_leggings", "custom:olympus_boots"]
    books: ["enchant:telekinesis:1", "enchant:autosmelt:1", "enchant:vampirism:1", "enchant:explosive:1"]
