  reaper:      {display: "<gradient:#ff0000:#550000>Жнец", kills: 500}
  survivor:    {display: "<green>Выживший", playtime: 600}
  oldtimer:    {display: "<gold>Старожил", playtime: 6000}
  unstoppable: {display: "<light_purple>Неудержимый", streak: 10}
  quester:     {display: "<aqua>Искатель", quests: 25}
  tycoon:      {display: "<yellow>Магнат", balance: 100000}
  shadow:      {display: "<dark_gray>Тень", ari: 29}
  # --- только из кейса титулов ---
  pirate:      {display: "<#4fc3f7>⚓ Пират", case: true}
  sailor:      {display: "<#81d4fa>Мореход", case: true}
  fisher:      {display: "<#80cbc4>Рыбак", case: true}
  wanderer:    {display: "<#b0bec5>Бродяга", case: true}
  shark:       {display: "<#29b6f6>Акула", case: true}
  storm:       {display: "<gradient:#90caf9:#5c6bc0>⛈ Шторм</gradient>", case: true}
  corsair:     {display: "<gradient:#4dd0e1:#00838f>Корсар</gradient>", case: true}
  kraken:      {display: "<gradient:#ab47bc:#00e5ff>Кракен</gradient>", case: true}
  leviathan:   {display: "<gradient:#7c4dff:#18ffff>Левиафан</gradient>", case: true}
  poseidon:    {display: "<gradient:#ffd54f:#00b0ff>♆ Посейдон</gradient>", case: true}
  abyss:       {display: "<gradient:#311b92:#00e5ff>Повелитель Глубин</gradient>", case: true}
  aquagod:     {display: "<gradient:#ff0055:#00f0ff:#b000ff><bold>✦ AQUA GOD ✦</bold></gradient>", case: true}
  demon:       {display: "<gradient:#ff0040:#7000ff>Демон", ari: 49}
