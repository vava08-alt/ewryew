# ================= СПЕЦ-ПРЕДМЕТЫ =================
special:
  golden_dome:                     # Золотой купол: неломаемая клетка 5x5 из стекла (внутри пусто 3x3x3), со стеклянным полом
    seconds: 15                    # сколько держится
    cooldown: 30
    glass: YELLOW_STAINED_GLASS
    inner-size: 3                  # пустое место внутри (3 -> клетка 5x5)
    inner-height: 3
  truth_snow:                      # Снег правды: подсвечивает невидимок рядом с местом попадания
    radius: 6
    glow-seconds: 15
    slow-seconds: 10               # Замедление I раскрытым невидимкам и тому, в кого попал
  temple_wall:                     # Стена храма: нерушимая стена перед игроком
    width: 5
    height: 5
    thickness: 2
    distance: 2                    # в скольких блоках перед игроком
    seconds: 15
    cooldown: 30
  coral_net:                       # Коралловая сеть: враги в квадрате size x size от попадания не могут двигаться
    size: 3
    seconds: 3
    cooldown: 3
  sea_aura:                        # Аура моря: ПКМ - снимает все эффекты, взамен Сила I и Скорость I
    buff-seconds: 30
    cooldown: 30
  rage_potion:                     # Зелье ярости (взрывное): урон + Сила IV и Замедление II
    damage: 8                      # урон при прямом попадании (8 = 4 ❤, проходит сквозь броню)
    seconds: 90
  aqua_charge:                     # Заряд аквамарина: борозда-полумесяц, облицованная призмарином + засасывание игроков рядом
    length: 6                      # длина дуги
    width: 2                       # ширина в середине (к концам сужается)
    depth: 4                       # глубина в середине (к концам мельче)
    lantern-chance: 0.15           # морские фонари на дне
    fatigue-level: 2               # враги в борозде: слепота + усталость этого уровня (хозяин - нет)
    pull-radius: 1.0
    cooldown: 3
    restore-seconds: 30            # через сколько земля восстановится (0 - не восстанавливать)

# ================= ДОНАТ-МАГАЗИН (Ari) /don =================
