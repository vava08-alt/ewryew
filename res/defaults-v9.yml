  base-limit: 1

# ================= ПРОМОКОДЫ /code =================
# Создать: /codes create <КОД> <награды> [активаций] [дней]
# Код ютубера: /codes creator <КОД> <ник_ютубера> <награды_игроку> [награда_ютуберу]
# Награды через запятую: coins:5000,ari:10,key:ari:2,rank:hunter,enchant:telekinesis:1,title:pirate
codes:
  creator-max-hours: 10            # код автора могут ввести только игроки с наигранным временем до N часов (0 - все)
  default-creator-reward: "ari:1"  # награда ютуберу за каждого активировавшего, если не указана

# ================= ЖАЛОБЫ / X-RAY =================
reports:
  cooldown-seconds: 20
xray:
  window-minutes: 20               # окно подсчёта
  diamond-veins: 6                 # жил алмазов за окно = подозрение
  debris-veins: 5                  # жил древних обломков за окно
  max-veins-per-100-stone: 3.0     # или слишком мало камня на найденные жилы

# ================= ЗАЩИТА ОТ ЭКСПЛОЙТОВ =================
exploits:
  book-max-pages: 50
  book-max-page-chars: 320
  book-max-bytes: 12000
  max-item-bytes: 60000            # шалкер/книга тяжелее - удаляется (защита от книжных банов)
  remove-illegal-items: true       # бедрок, барьеры, командные блоки и т.п. у не-операторов
  remove-illegal-enchants: true    # уровни выше 10 (32к) сбрасываются до максимума
  max-enchant-level: 10
  pearl-glitch-fix: true           # жемчуг не телепортирует внутрь блоков
  block-inventory-entity-portals: true   # ослы/ламы/вагонетки с сундуком не проходят порталы (дюп)
  commands-per-5s: 12
  commands-kick-per-5s: 25
  hanging-per-chunk: 64
  armor-stands-per-chunk: 32

