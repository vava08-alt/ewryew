  champion3:   {display: "<gradient:#ffab40:#8d6e63><bold>Бронза сезона</bold></gradient>", case: true}
  snowman:     {display: "<#e3f2fd>☃ Снеговик", case: true}
  santa:       {display: "<gradient:#ff1744:#ffffff>Дед Мороз</gradient>", case: true}
  frost:       {display: "<gradient:#80d8ff:#e1f5fe>❄ Ледяной Король</gradient>", case: true}
