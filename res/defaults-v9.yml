# ================= АВТОБЭКАПЫ =================
# Каждые interval-hours сервер сохраняет миры и делает zip в папку backups/ (рядом с paper.jar).
# Восстановление: остановить сервер, удалить папки миров, распаковать нужный архив в папку сервера.
backups:
  enabled: true
  interval-hours: 6
  first-after-minutes: 30   # первый бэкап через N минут после запуска
  keep: 8                   # сколько последних архивов хранить
  max-age-days: 0           # 0 = не удалять по возрасту
  folder: backups
  compression: 3            # 0-9 (больше = меньше размер, дольше)
  include-plugins: true     # данные AnarchyCore (игроки, кланы, приваты, баны...)
  worlds: [world, world_nether, world_the_end, spawn]
  extra: []                 # доп. папки/файлы, напр. ["plugins/GrimAC"]

# ================= АУКЦИОН /ah =================
auction:
  tax-percent: 5
  hours: 48
  max-lots: 5
  max-price: 100000000
  announce: true

# ================= БУСТЫ И СКИДКИ =================
# Буст x2 действует на ВЕСЬ сервер. Цены в Ari. Выдать: aqua boost <ник> coins|pass [минут]
boosts:
  minutes: 60
  coins: {price: 99, multiplier: 2.0}
  pass: {price: 79, multiplier: 2.0}
sales:
  timezone: Europe/Moscow
  weekend-percent: 15          # скидка в сб/вс
  start-percent: 30            # скидка открытия сервера
  start-until: 1792982575000     # мс; задать: /aqua startsale <дней> [процент]
  # временная акция: /aqua sale <процент> <часов> [название]

# ================= АНТИБОТ =================
antibot:
  enabled: true
  captcha: true                # капча для новых игроков: падают в отдельном мире, пока не решат
  # виды: digits (цифры на карте), letters (буквы), math (пример), count (посчитать круги),
  #       color (нажать блок нужного цвета), item (нажать нужный предмет), order (нажать 1-2-3-4 по порядку)
  captcha-types: [digits, letters, math, count, color, item, order]
  captcha-seconds: 120         # время на капчу
  captcha-attempts: 3          # попыток (после ошибки даётся другая капча)
  attack-threshold: 8          # столько новых входов за 10 сек = бот-атака
  attack-seconds: 120          # режим атаки: новым игрокам вход запрещён
  joins-per-ip-30s: 5
  max-online-per-ip: 3
  max-accounts-per-ip: 3
  exempt-ips: ["127.0.0.1"]   # через туннель (bore/playit) все IP = 127.0.0.1 - оставь в исключениях

# ================= СЕЗОНЫ И ПРОПУСК =================
season:
  number: 1
  name: "Начало"
  ends: "2026-12-01"
  rewards-ari: [500, 300, 150]  # топ-3 по убийствам за сезон
pass:
  premium-price: 149            # Ari. Выдать: aqua pass premium <ник>
  xp-per-level: 100

# ================= ВАРПЫ ИГРОКОВ /pwarp =================
