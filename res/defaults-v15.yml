# ================= АВТОШАХТА (спавн) =================
# Куб руды в мире спавна, полностью обновляется каждые reset-minutes. Слои сверху вниз - чем глубже, тем ценнее.
# Ломать можно только внутри шахты, ставить блоки нельзя. Перед первым заполнением исходные блоки сохраняются
# в plugins/AnarchyCore/mine-original.yml. Админ: /mine reset | build | remove (вернуть исходные блоки) | reload
mine:
  enabled: true
  world: spawn
  pos1: 292 5 347 # угол шахты (x y z)
  pos2: 299 -4 355 # противоположный угол
  reset-minutes: 7
  warn-seconds: [60, 10] # предупредить игроков рядом за N секунд до обновления
  hologram: 296.0 8.6 351.5 # голограмма с таймером (x y z); пусто - без неё
  layers: # сверху вниз. depth - сколько слоёв занимает уровень; blocks - "БЛОК вес" (больше вес - чаще)
  - name: <white>Обычный
    depth: 3
    blocks: [STONE 45, COAL_ORE 30, COPPER_ORE 15, IRON_ORE 10]
  - name: <green>Необычный
    depth: 3
    blocks: [DEEPSLATE 40, DEEPSLATE_IRON_ORE 25, DEEPSLATE_COPPER_ORE 10, DEEPSLATE_REDSTONE_ORE 12, DEEPSLATE_LAPIS_ORE 10, DEEPSLATE_GOLD_ORE 3]
  - name: <aqua>Редкий
    depth: 2
    blocks: [DEEPSLATE 42, DEEPSLATE_IRON_ORE 15, DEEPSLATE_GOLD_ORE 25, DEEPSLATE_REDSTONE_ORE 7, DEEPSLATE_LAPIS_ORE 8, DEEPSLATE_DIAMOND_ORE 3]
  - name: <light_purple>Эпический
    depth: 1
    blocks: [DEEPSLATE 48, DEEPSLATE_GOLD_ORE 25, DEEPSLATE_REDSTONE_ORE 10, DEEPSLATE_DIAMOND_ORE 8, DEEPSLATE_EMERALD_ORE 9]
  - name: <gold>Легендарный
    depth: 1
    blocks: [DEEPSLATE 47, DEEPSLATE_GOLD_ORE 20, DEEPSLATE_DIAMOND_ORE 12, DEEPSLATE_EMERALD_ORE 13, ANCIENT_DEBRIS 8]

# ================= СКУПЩИК (/seller-buyer, /buyer, /sell) =================
# Сдавай ресурсы серверу за монеты. У каждого предмета свой лимит сдачи на игрока,
# все лимиты сбрасываются каждые reset-hours часов (время до сброса - в меню скупщика).
# ТОП-5 - самые ценные предметы: цена в 2-3 раза выше обычной, но сдать их можно меньше.
# Строка: "МАТЕРИАЛ цена лимит". В top: "МАТЕРИАЛ обычная_цена множитель лимит".
# Скупаются только «чистые» предметы - без имени, описания, чар и поломки.
buyer:
  reset-hours: 5
  top-title: <gradient:#ffd700:#ff8c00><bold>★ ТОП-5 скупщика</bold></gradient>
  top:
  - ENCHANTED_GOLDEN_APPLE 600 3 2
  - NETHERITE_INGOT 400 2.5 4
  - NETHER_STAR 500 2 1
  - TOTEM_OF_UNDYING 150 2 4
  - ANCIENT_DEBRIS 85 2.5 8
  categories:
    ores:
      name: <aqua><bold>Руды и минералы
      icon: DIAMOND
      items:
      - DIAMOND 25 64
      - EMERALD 12 64
      - NETHERITE_SCRAP 90 8
      - GOLD_INGOT 5 192
