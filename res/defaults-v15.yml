# ================= ЛИМИТЫ / АНТИЛАГ =================
limits:
  disable-phantoms: true           # фантомы не спавнятся (бессонница выключена во всех мирах)
  spawners-per-chunk: 6
  hoppers-per-chunk: 32
  observers-per-chunk: 48
  pistons-per-chunk: 64
  redstone-updates-per-second: 400   # больше в чанке - часы ломаются
  piston-moves-per-second: 120
  mobs-per-chunk: 40
  same-animals-per-chunk: 24
  clear-items-minutes: 10            # очистка выброшенных предметов (предупреждения 60/30/10/5..1 сек)

# ================= КЛАНЫ /clan =================
clans:
  create-cost: 5000
  max-members: 15
  war-minutes: 60
  chest-officers-only: false     # true - клановый сундук только для главы и офицеров
  # Опыт клана
  xp:
    kill: 10                     # убийство игрока не из клана
    war-kill: 10                 # доп. опыт за убийство во время войны
    kill-same-victim-minutes: 10 # за одного и того же игрока опыт раз в N минут (антифарм)
    online-member-10min: 2       # за каждого участника онлайн (не на спавне) каждые 10 минут
    deposit-coins-per-xp: 100    # +1 опыт за каждые 100 монет, вложенные в банк (снятие не даёт фарм)
    koth: 150                    # победа в KOTH
    war-win: 300                 # победа в войне кланов
  # Уровни: опыт, лимит участников, ряды кланового сундука (/clan chest), бафы для онлайн-участников вне спавна
  levels:
    1: {xp: 0, members: 15, chest-rows: 0, buffs: []}
    2: {xp: 500, members: 16, chest-rows: 1, buffs: []}
    3: {xp: 1500, members: 18, chest-rows: 2, buffs: ["HASTE:0"]}
    4: {xp: 3500, members: 20, chest-rows: 3, buffs: ["HASTE:0"]}
    5: {xp: 7000, members: 22, chest-rows: 3, buffs: ["HASTE:0", "NIGHT_VISION:0"]}
    6: {xp: 12000, members: 24, chest-rows: 4, buffs: ["HASTE:0", "NIGHT_VISION:0", "FIRE_RESISTANCE:0"]}
    7: {xp: 20000, members: 26, chest-rows: 4, buffs: ["HASTE:1", "NIGHT_VISION:0", "FIRE_RESISTANCE:0"]}
    8: {xp: 32000, members: 28, chest-rows: 5, buffs: ["HASTE:1", "NIGHT_VISION:0", "FIRE_RESISTANCE:0", "SPEED:0"]}
    9: {xp: 50000, members: 30, chest-rows: 5, buffs: ["HASTE:1", "NIGHT_VISION:0", "FIRE_RESISTANCE:0", "SPEED:0"]}
    10: {xp: 75000, members: 35, chest-rows: 6, buffs: ["HASTE:1", "NIGHT_VISION:0", "FIRE_RESISTANCE:0", "SPEED:0", "LUCK:0"]}

# ================= ТЕРРИТОРИИ КЛАНОВ (/clan zones) =================
# Встань на точку только своим кланом и удерживай capture-seconds - точка твоя.
# Если на точке есть чужие (или игроки без клана) - захват оспаривается и замирает.
# Владелец получает income-coins в банк клана и income-xp опыта каждые income-minutes (если кто-то из клана онлайн).
territories:
  enabled: true
  world: world
  radius: 12
  capture-seconds: 180
  capture-xp: 100
  income-minutes: 60
  income-coins: 1500
  income-xp: 50
  income-needs-online: true
  points:
    north: {name: "Северный форт", x: 0, z: -1500}
    east: {name: "Восточная шахта", x: 1500, z: 0}
    south: {name: "Южный рынок", x: 0, z: 1500}
    west: {name: "Западная крепость", x: -1500, z: 0}
    center: {name: "Сердце анархии", x: 750, z: 750}

# ================= АВТОБЭКАПЫ =================
# Каждые interval-hours сервер сохраняет миры и делает zip в папку backups/ (рядом с paper.jar).
# Восстановление: остановить сервер, удалить папки миров, распаковать нужный архив в папку сервера.
backups:
  enabled: true
  interval-hours: 6
  first-after-minutes: 30   # первый бэкап через N минут после запуска
  keep: 8                   # сколько последних архивов хранить
  max-age-days: 0           # 0 = не удалять по возрасту
  folder: backups
  compression: 3            # 0-9 (больше = меньше размер, дольше)
  include-plugins: true     # данные AnarchyCore (игроки, кланы, приваты, баны...)
  worlds: [world, world_nether, world_the_end, spawn]
  extra: []                 # доп. папки/файлы, напр. ["plugins/GrimAC"]

# ================= АУКЦИОН /ah =================
auction:
  tax-percent: 5
  hours: 48
  max-lots: 5
  max-price: 100000000
  announce: true

# ================= БУСТЫ И СКИДКИ =================
# Буст x2 действует на ВЕСЬ сервер. Цены в Ari. Выдать: aqua boost <ник> coins|pass [минут]
boosts:
  minutes: 60
  coins: {price: 99, multiplier: 2.0}
  pass: {price: 79, multiplier: 2.0}
sales:
  timezone: Europe/Moscow
  weekend-percent: 15          # скидка в сб/вс
  start-percent: 30            # скидка открытия сервера
  start-until: 1792982575000     # мс; задать: /aqua startsale <дней> [процент]
  # временная акция: /aqua sale <процент> <часов> [название]

# ================= АНТИБОТ =================
antibot:
  enabled: true
  captcha: true                # капча для новых игроков: падают в отдельном мире, пока не решат
  # виды: digits (цифры на карте), letters (буквы), math (пример), count (посчитать круги),
  #       color (нажать блок нужного цвета), item (нажать нужный предмет), order (нажать 1-2-3-4 по порядку)
  captcha-types: [digits, letters, math, count, color, item, order]
  captcha-seconds: 120         # время на капчу
  captcha-attempts: 3          # попыток (после ошибки даётся другая капча)
  attack-threshold: 8          # столько новых входов за 10 сек = бот-атака
  attack-seconds: 120          # режим атаки: новым игрокам вход запрещён
  joins-per-ip-30s: 5
  max-online-per-ip: 3
  max-accounts-per-ip: 3
  exempt-ips: ["127.0.0.1"]   # через туннель (bore/playit) все IP = 127.0.0.1 - оставь в исключениях

# ================= БОЕВОЙ ПРОПУСК =================
pass:
  premium-price: 149            # Ari. Выдать: aqua pass premium <ник>
  xp-per-level: 100

# ================= ВАРПЫ ИГРОКОВ /pwarp =================
pwarps:
  cost: 2000
  ad-cost: 1000
  ad-hours: 24
  base-limit: 1

# ================= ПРОМОКОДЫ /code =================
# Создать: /codes create <КОД> <награды> [активаций] [дней]
# Код ютубера: /codes creator <КОД> <ник_ютубера> <награды_игроку> [награда_ютуберу]
# Награды через запятую: coins:5000,ari:10,key:ari:2,rank:hunter,enchant:telekinesis:1,title:pirate
codes:
  creator-max-hours: 10            # код автора могут ввести только игроки с наигранным временем до N часов (0 - все)
  default-creator-reward: "ari:1"  # награда ютуберу за каждого активировавшего, если не указана

# ================= ЖАЛОБЫ / X-RAY =================
reports:
  cooldown-seconds: 20
xray:
  window-minutes: 20               # окно подсчёта
  diamond-veins: 6                 # жил алмазов за окно = подозрение
  debris-veins: 5                  # жил древних обломков за окно
  max-veins-per-100-stone: 3.0     # или слишком мало камня на найденные жилы

# ================= ЗАЩИТА ОТ ЭКСПЛОЙТОВ =================
exploits:
  book-max-pages: 50
  book-max-page-chars: 320
  book-max-bytes: 12000
  max-item-bytes: 60000            # шалкер/книга тяжелее - удаляется (защита от книжных банов)
  remove-illegal-items: true       # бедрок, барьеры, командные блоки и т.п. у не-операторов
  remove-illegal-enchants: true    # уровни выше 10 (32к) сбрасываются до максимума
  max-enchant-level: 10
  pearl-glitch-fix: true           # жемчуг не телепортирует внутрь блоков
  block-inventory-entity-portals: true   # ослы/ламы/вагонетки с сундуком не проходят порталы (дюп)
  commands-per-5s: 12
  commands-kick-per-5s: 25
  hanging-per-chunk: 64
  armor-stands-per-chunk: 32

# ================= АДМИНКА =================
admin:
