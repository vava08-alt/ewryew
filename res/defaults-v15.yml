# ================= ИИ-АНТИЧИТ AquaGuard =================
# Собирает улики (аим, килл-аура, автокликер, кристалл/якорь-аура, автототем, InvMove, стилер, чит-клиенты,
# флаги GrimAC, X-Ray) и считает вероятность читов. Выше watch-threshold - усиленно следит за игроком,
# выше call-threshold - вызывает на проверку: игрок замораживается, модераторам приходит письмо с кнопкой
# «Принять». Принявший получает все сообщения античита об игроке. Команда для персонала: /ac
# ИИ учится на решениях модераторов: /check stop = чист, /check ban (или любой бан) = читер.
anticheat:
  enabled: true
  name: "AquaGuard AI"
  watch-threshold: 0.40            # вероятность читов, с которой ИИ начинает усиленно следить
  call-threshold: 0.93             # вероятность, с которой ИИ вызывает на проверку
  min-events: 5                    # минимум подозрительных эпизодов для вызова (кроме чит-клиента)
  require-staff-online: true       # вызывать только если в сети есть модератор (иначе - письмо в почту)
  accept-timeout-minutes: 5        # никто не принял проверку за это время - игрок отпускается
  recall-cooldown-minutes: 30      # повторный вызов того же игрока не раньше
  clean-cooldown-minutes: 120      # после решения «чист» не вызывать столько минут
  ban-on-quit-before-accept: true  # выход до того, как модератор принял проверку, тоже бан 30 дней
  exempt-staff: true               # модераторов и админов не проверять
  learning: true                   # ИИ дообучается на решениях модераторов (веса: anticheat-model.yml)
  max-ping: 400                    # при пинге выше улики почти не учитываются
  discord-webhook: ""              # ссылка на вебхук Discord - письма о вызовах будут дублироваться туда
  disabled-checks: []              # выключить проверки, например: [CLICKER, AIM_SENS, STEALER]
  client-brands: [meteor, wurst, aristois, liquidbounce, rusherhack, thunderhack, nursultan, celestial, expensive, wexside, deadcode, akrien, bleachhack, inertia, impact, konas, phobos, boze]
  client-channels: [meteor, wurst, liquidbounce, aristois, rusherhack, thunderhack, nursultan, bleachhack]

