  hunt: 600
  ghost: 1200
  feed: 300
  heal: 600
  repair: 1800
  back: 600
  near: 60
  rtp-far: 300
  rtp-player: 600
  top: 120
  bc: 3600
ghost-duration: 30
ranks-30d-factor: 0.4        # привилегия на 30 дней = 40% от цены навсегда

# ================= ПРИВАТЫ =================
# Поставь блок привата - территория (2*radius+1)x(2*radius+1) на всю высоту твоя.
regions:
  min-distance-from-spawn: 100
  tiers:
    coal: {material: COAL_BLOCK, name: "<gray>Приват I <dark_gray>(11x11)", radius: 5, explosion-proof: false}
    iron: {material: IRON_BLOCK, name: "<white>Приват II <dark_gray>(21x21)", radius: 10, explosion-proof: false}
    gold: {material: GOLD_BLOCK, name: "<gold>Приват III <dark_gray>(31x31)", radius: 15, explosion-proof: false}
    diamond: {material: DIAMOND_BLOCK, name: "<aqua>Приват IV <dark_gray>(51x51, от взрывов)", radius: 25, explosion-proof: true}
    emerald: {material: EMERALD_BLOCK, name: "<green>Приват V <dark_gray>(81x81, от взрывов)", radius: 40, explosion-proof: true}
    netherite: {material: NETHERITE_BLOCK, name: "<gradient:#ff4040:#aa00ff>Приват VI <dark_gray>(121x121, от взрывов)", radius: 60, explosion-proof: true}

