# ================= AnarchyCore 2.0 =================
config-version: 15               # не менять: по ней плагин дописывает новые настройки при обновлении
server-name: "AquaAnarchy"
prefix: "<gradient:#00f0ff:#0080ff><bold>AquaAnarchy</bold></gradient> <dark_gray>»</dark_gray> "
currency: "⛃"
ari-name: "Ari"
ari-symbol: "✦"
donate-site: "site.ru/donate"

auth:
  timeout-seconds: 60
  session-minutes: 10
  max-attempts: 3
  min-password: 5

combat:
  # Кулдауны предметов в режиме боя (сек): пока таймер не истёк, предмет нельзя съесть/выпить/бросить
  item-cooldowns:
    enchanted_golden_apple: 90     # чарка
    golden_apple: 20               # гэпл
    regeneration: 20               # любые зелья регенерации
    healing: 20                    # зелья исцеления I и II (обычные, взрывные, туманные)
  item-cooldowns-only-in-combat: true   # false - кулдауны действуют всегда
  tag-seconds: 15
  kill-on-logout: true
  blocked-commands: [ext, nv, stonecutter, grindstone, smithing, loom, cartography, ecsee, tpa, tpahere, tpaccept, home, h, rtp, wild, back, ghost, ec, enderchest, craft, heal, feed, repair, fix, suicide, kill, kit, spawn, fly, top, anvil, invsee, menu, m]

economy:
  start-balance: 100
  playtime-reward: 5
  playtime-interval: 10
  kill-reward: 15
  steal-percent: 10
  daily-reward: 100          # /daily, умножается: игрок x1, каждый следующий ранг +0.5
  ari-to-coins: 1000         # 1 Ari = 1000 монет в обменнике
  # Монеты за убийство мобов (дробное - шансом: 0.5 = 1 монета в половине случаев)
  mob-rewards:
    enabled: true
    monster: 2                 # любой враждебный моб
    animal: 1                  # животные и водные мобы
    spawner-multiplier: 0.25   # мобы со спавнеров (фермы) дают в 4 раза меньше
    actionbar: true
    mobs:                      # особые мобы
      CREEPER: 3
      ENDERMAN: 4
      WITCH: 4
      BLAZE: 4
      WITHER_SKELETON: 5
      PIGLIN_BRUTE: 8
      EVOKER: 10
      RAVAGER: 15
      ELDER_GUARDIAN: 100
      WARDEN: 250
      WITHER: 500
      ENDER_DRAGON: 1000
      ZOMBIFIED_PIGLIN: 1
      SLIME: 1
      MAGMA_CUBE: 1

streaks:
  glow-from: 5
  announce: [3, 5, 10, 15, 20, 30, 50, 100]
  bonus-per-kill: 5

heads:
  drop-on-pvp: true

teleport:
  tpa-timeout: 60

spawn:
  world: spawn               # отдельный мир-хаб со спавном (без урона, мобов, PvP и строительства)
  location: "spawn;332.5;6.0;350.5;180.0;0.0"
  time: 6000                 # время суток на спавне (не меняется)
  builders: [lDcc]          # кто может строить/ломать на спавне (core spawnbuilder add|remove <ник>)
  void-y: -70                # упал ниже - телепорт обратно
  return-delay-ticks: 50     # после входа игрок возвращается туда, где вышел (через 2.5 сек)
  # точку можно поменять командой /core setspawn

rtp:
  world: world
  normal: {min: 300, max: 3000}        # /rtp - для всех
  far: {min: 5000, max: 30000}         # /rtp far - с Hunter
  player: {min: 25, max: 70}           # /rtp player - к случайному игроку, с Lord

hunt:
  range: 5000

chat:
  cooldown-ms: 2000

announcements:
  interval-minutes: 5
  messages:
  - "<gray>Главное меню: <yellow>/menu</yellow>. Профиль: <yellow>/profile"
  - "<gray>Эксклюзивные предметы: <light_purple>/shop</light_purple>, привилегии: <gold>/don"
  - "<gray>Защити базу - купи приват: <yellow>/market</yellow> (монеты) или <light_purple>/shop</light_purple> (донат)"
  - "<gray>Кейсы стоят на спавне: <aqua>донат-кейс, Ari-кейс и кейс титулов</aqua>. <yellow>/cases"
  - "<gray>Ключ от Ari-кейса каждый день в <gold>/daily</gold>, от кейса титулов - за все квесты дня"
  - "<gray>Ежедневные квесты: <aqua>/quests</aqua>, награда за вход: <gold>/daily"
  - "<gray>Серия из <red>5</red> убийств подсвечивает тебя для всего сервера. Беги."
  - "<gray>Создай клан с друзьями: <aqua>/clan create <тег> <название></aqua> - общий приват, банк и войны"
  - "<gray>Продавай и покупай у игроков: <gold>/ah</gold> - аукцион"
  - "<gray>Скупщик: <gold>/seller-buyer</gold> - ресурсы за монеты, ТОП-5 предметов в 2-3 раза дороже"
  - '<gray>Автошахта на спавне обновляется каждые 7 минут: <gold>/warp mine'
  - "<gray>Кланы качают уровень: больше мест, общий сундук и бафы. Захватывай территории: <aqua>/clan zones</aqua>"
  - "<gray>Сферы и талисманы дают буст во второй руке - <light_purple>/shop</light_purple>"
  - "<gray>Боевой пропуск на 50 уровней: <yellow>/pass</yellow> - награды за квесты и онлайн"
  - "<gray>Когда следующий ивент и где он идёт: <yellow>/event delay"
  - "<gray>Варпы игроков - магазины и фермы: <green>/pwarps</green>, свой варп: <green>/pwarp set"
  - "<gray>Буст x2 монет для <bold>всего</bold> сервера: <light_purple>/boost"
  - "<gray>Видишь читера? Напиши <red>/spec <ник></red> - модератор проследит за ним"
  - "<gray>Есть промокод от ютубера? Вводи <gold>/code <код>"

rules:
- "<gold><bold>Правила анархии</bold>"
- "<gray>1. <white>Можно всё: гриф вне приватов, PvP, ловушки, обман, рейды."
- "<gray>2. <white>Читы ловит ИИ-античит AquaGuard + Grim. Вызвали на проверку - не выходи."
- "<gray>3. <white>Лаг-машины и краш-эксплойты сервера - бан."
- "<gray>4. <white>Администрация не возвращает вещи."

scoreboard:
  # Скорборд в стиле "INFO / ECONOMY". Плейсхолдеры: {name} {rank_badge} {clan} {ping} {kills} {deaths}
  #   {coins} {coins_short} {ari} {ari_short} {keys} {quests} {online} {server} {title} {streak} {playtime} {event}
  # Значок ранга: ranks.<id>.symbol. Красные цифры справа скрыты.
  title: "<gradient:#00f0ff:#0080ff><bold>ᴀǫᴜᴀᴀɴᴀʀᴄʜʏ</bold></gradient>"
  no-clan: "Нет"
  lines:
  - " "
  - "<#00d9ff>↱ <bold>ɪɴꜰᴏ:</bold>"
  - "<#00d9ff>┃ <white>Ник: <#5ce1ff>{name}"
  - "<#00d9ff>┃ <white>Ранг: {rank_badge}"
  - "<#00d9ff>┃ <white>Клан: <#5ce1ff>{clan}"
  - "<#00d9ff>┃ <white>Пинг: <#5ce1ff>{ping}мс"
  - "<#00d9ff>┃ <white>У/С: <#5ce1ff>{kills} / {deaths}"
  - "  "
  - "<#00d9ff>↱ <bold>ᴇᴄᴏɴᴏᴍʏ:</bold>"
  - "<#00d9ff>┃ <white>Баланс: <#5ce1ff>{coins_short} <gold>⛃"
  - "<#00d9ff>┃ <white>Ari: <#5ce1ff>{ari_short} <light_purple>✦"
  - "   "
  - "<gray>━━<white>◆<gray>━[ <#5ce1ff>Anarchy</#5ce1ff> <gray>]━<white>◆<gray>━━"

