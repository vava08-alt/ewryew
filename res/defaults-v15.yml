# ================= PVP-АРЕНА (/pvp или NPC в воротах у купола спавна) =================
# Отдельный мир "pvp": зелёный остров с холмами, кастомными деревьями, вышками и постройками,
# лут-шалкеры 4 редкостей в определённых местах, в центре яма в Ад - два прохода к залу Элитного шалкера.
# Площадь появления - безопасная зона (PvP выключено), за её границей PvP работает. Остров окружён барьером.
# Порталов нет: выход на спавн - /spawn, из Ада наверх - пузырьковый подъём в зале Элитного шалкера.
# Карта строится один раз при первом запуске. Перестроить: /pvp rebuild + рестарт. Дорога на спавне: /pvp hub, откат: /pvp unhub
pvp-arena:
  enabled: true
  safe-radius: 11                 # радиус сферы безопасной зоны (центр - середина площади на уровне пола)
  temp-block-seconds: 60           # блоки, поставленные игроками, исчезают (карту не ломают)
  # Шалкеры ломаются ударами (любым предметом), над ними пишется, сколько ударов осталось.
  # После поломки выпадает лут, шалкер появляется снова через cooldown-seconds своей редкости (таймер над местом).
  # Где какие: обычные - святилища, лагерь, рынок, хижина; редкие - вышки и бункер; эпические - храм и форт; легендарные - в Аду.
  shulkers:
    common:
      name: "<white>Обычный"
      block: WHITE_SHULKER_BOX
      hits: 20
      cooldown-seconds: 120
      items-min: 2
      items-max: 4
      loot:                        # "ПРЕДМЕТ вес": чем больше вес, тем чаще выпадает. Формат предмета как в китах
